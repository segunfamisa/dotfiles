# tmux configuration

# Better terminal/colors support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Usability
set -g mouse on
set -g history-limit 100000
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Easier splits, preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Start windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"

# Zellij-inspired navigation -------------------------------------------------
# Keep tmux's native Ctrl-b command layer: its familiar bindings (c, %, ",
# [, n, p, o, z, and ,) correspond to the tmux-compatibility layer in the
# Zellij configuration. These additions cover the direct shortcuts used there.

# Move between panes without first entering prefix mode. Alt+Left/Right stay
# unbound so the shell and editors retain word-wise cursor movement.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-n split-window -v -c "#{pane_current_path}"
bind-key -n M-p setw synchronize-panes
bind-key -n M-i swap-window -t -1
bind-key -n M-o swap-window -t +1

# Ctrl-s opens scrollback, like Zellij's scroll mode. Copy mode is configured
# above with vi keys; use q or Escape to return to the live pane.
bind-key -n C-s copy-mode

# The prefix table gets the same Vim-like pane navigation and intuitive resize
# controls used by the Zellij pane and resize modes.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Match Zellij's convenient pane actions after the Ctrl-b prefix. The existing
# prefix-r reload binding is intentionally retained; prefix-, renames windows.
bind-key x confirm-before -p "kill pane #{pane_index}? (y/n)" kill-pane
bind-key b break-pane -d
bind-key s setw synchronize-panes

# Zellij's Ctrl-q quits; keep the equivalent available but require a prompt so
# it cannot accidentally destroy all tmux sessions.
bind-key -n C-q confirm-before -p "kill tmux server and all sessions? (y/n)" kill-server
